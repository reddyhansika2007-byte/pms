<h2 style="color:black; text-align:center">LOGIN</h2>

        <label><b>Login As:</b></label>

        <label>Admin</label>

        <input type="radio" name="role" value="tenant">

        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               style="width:350px; height:35px;">

        <br><br>

        <label>Password:</label>
        <br>

        <input type="password"
               id="password"
               name="password"
               placeholder="Enter your password"

        <input type="submit"
               value="LOGIN"
               style="font-size:20px; padding:10px 35px;">

</form>

<script>

    let adminEmail = "nikhitha.kallam@gmail.com";
    let adminPassword = "admin123";

    let form = document.querySelector("form");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value.trim();

        let role = document.querySelector(
            'input[name="role"]:checked'
        );


        if (role == null) {

            alert("Please select your role");

        }


        else if (role.value == "admin") {

            if (email === adminEmail && password === adminPassword) {

                alert("Admin Login Successful!");

                window.location.href = "Admin-Page.html";

            }

            else {

                alert("Invalid Admin Email or Password!");

            }

        }


        else if (role.value == "owner") {

            if (email != "" && password != "") {

                alert("Property Owner Login Successful!");

                window.location.href = "Owner-Page.html";

            }

            else {

                alert("Please enter email and password!");

            }

        }


        else if (role.value == "tenant") {

            if (email != "" && password != "") {

                alert("Tenant Login Successful!");

                window.location.href = "Tenant-Page.html";

            }

            else {

                alert("Please enter email and password!");

            }

        }

    });

</script>
